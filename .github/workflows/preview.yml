# When Netlify finishes a deploy preview for a pull request, test that
# preview address: security headers, redirects, pages, and a passive OWASP ZAP scan.
name: preview
on:
  deployment_status:
permissions:
  contents: read
jobs:
  verify:
    if: github.event.deployment_status.state == 'success' && contains(github.event.deployment.environment, 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Test the preview address
        run: npm run test:remote
      - name: OWASP ZAP baseline scan (passive)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.BASE_URL }}
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: false
