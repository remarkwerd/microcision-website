# Runs every test on each pull request and on main.
# "ci / test" is a required check: a pull request cannot be merged until it passes.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install test tools
        run: npm install --no-audit --no-fund
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: HTML check
        run: npm run test:html
      - name: Link check (internal links)
        run: npm run test:links
      - name: Page tests (wording, images, menu, form, accessibility)
        run: npm run test:e2e
      - name: Speed and quality scores (Lighthouse)
        run: npm run test:lighthouse
      - name: Save the test report if something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: |
            playwright-report/
            test-results/
            lighthouse-report/
          retention-days: 14
