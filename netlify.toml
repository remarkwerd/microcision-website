# Netlify settings for www.microcision.com.
# The site is the plain files in site/. There is no build step.

[build]
  publish = "site"
  command = ""

# ---------------------------------------------------------------------------
# Redirects for old Wix addresses.
# Pages with the same name as on Wix (for example /history) need no rule:
# Netlify serves site/history/index.html for both /history and /history/.
# ---------------------------------------------------------------------------

# Old job postings and the July 2026 announcement were dropped (decision D13).
[[redirects]]
  from = "/about-1"
  to = "/"
  status = 301
[[redirects]]
  from = "/cnc-swiss-operators"
  to = "/"
  status = 301
[[redirects]]
  from = "/cnc-lathe-set-up-and-operators"
  to = "/"
  status = 301
[[redirects]]
  from = "/cnc-3-5-axis-milling-set-up-and-operator"
  to = "/"
  status = 301
[[redirects]]
  from = "/finishing-operator"
  to = "/"
  status = 301
[[redirects]]
  from = "/copy-of-finishing-operator"
  to = "/"
  status = 301
[[redirects]]
  from = "/sales-manager"
  to = "/"
  status = 301
[[redirects]]
  from = "/copy-of-sales-manager"
  to = "/"
  status = 301
[[redirects]]
  from = "/copy-of-sales-business-develpment-m"
  to = "/"
  status = 301
[[redirects]]
  from = "/general-5"
  to = "/"
