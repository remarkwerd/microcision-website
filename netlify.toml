# The quality certificate PDF used to live at a Wix file address.
[[redirects]]
  from = "/_files/ugd/31e942_ce5f7565fa924c8483769d023a269bf7.pdf"
  to = "/files/microcision-iso-13485-certificate.pdf"
  status = 301

